# Render.com "Blueprint" — NOVA İndirici web sürümü
services:
  - type: web
    name: nova-indirici
    runtime: docker
    plan: starter
    region: frankfurt
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NOVA_MAX_JOBS      # sunucuda aynı anda çalışan indirme
        value: "3"
      - key: NOVA_PER_USER      # ziyaretçi başına aynı anda indirme
        value: "2"
      - key: NOVA_MAX_ITEMS     # oynatma listelerinde en fazla öğe
        value: "10"
      - key: NOVA_MAX_FILESIZE  # tek dosya üst sınırı
        value: "2G"
