#cloud-config
# NOVA İndirici web sürümü — Hetzner'de sunucu oluştururken "Cloud config" kutusuna yapıştır.
package_update: true
packages:
  - docker.io
  - git
runcmd:
  - systemctl enable --now docker
  - git clone https://github.com/pepsicosamet-arch/NovaIndirici /opt/nova
  - docker network create nova
  - sh /opt/nova/deploy/update.sh --force
  - echo '*/30 * * * * root sh /opt/nova/deploy/update.sh >> /var/log/nova-update.log 2>&1' > /etc/cron.d/nova-update
