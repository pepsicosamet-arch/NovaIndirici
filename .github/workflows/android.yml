name: Android paketi
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml', 'dist/latest.json']
permissions:
  contents: write
concurrency:
  group: dist-commit
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Sürümü oku
        run: echo "VER=$(python3 -c "import json;print(json.load(open('dist/latest.json'))['version'])")" >> "$GITHUB_ENV"
      - name: APK derle
        working-directory: android
        run: gradle --no-daemon --stacktrace assembleRelease -PnovaVersion=$VER
      - name: Çıktılar
        run: ls -la android/app/build/outputs/apk/release/
      - name: dist klasörüne ekle
        run: |
          OUT=android/app/build/outputs/apk/release
          mkdir -p build && cp $OUT/app-arm64-v8a-release.apk build/a64.apk && cp $OUT/app-armeabi-v7a-release.apk build/a32.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            cp build/a64.apk dist/NOVA-Indirici-Android.apk
            cp build/a32.apk dist/NOVA-Indirici-Android-32bit.apk
            git add dist/NOVA-Indirici-Android.apk dist/NOVA-Indirici-Android-32bit.apk
            if git diff --cached --quiet; then echo "değişiklik yok"; exit 0; fi
            git commit -q -m "Android paketi v$VER [skip ci]"
            if git push -q origin HEAD:main; then exit 0; fi
            sleep 10
          done
          exit 1
